<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Sefaria nicht erreichbar</title>
  <style>
    body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; background: #fbfaf7; color: #1d1d1f; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #1c1c1e; color: #f2f2f7; } }
    button { font: inherit; padding: 8px 18px; border-radius: 8px; border: 1px solid #1f4e8c; background: #1f4e8c; color: #fff; cursor: pointer; margin-top: 12px; }
    p { max-width: 420px; color: #6e6e73; }
  </style>
</head>
<body>
  <div>
    <h2>Sefaria ist gerade nicht erreichbar</h2>
    <p>Bitte prüfe die Internetverbindung (und ein eventuell aktives VPN) und versuche es erneut.</p>
    <p>Bereits heruntergeladene Texte kannst du trotzdem lesen: Menü <b>Werkzeuge → Offline-Bibliothek</b> (Cmd+Shift+O).</p>
    <button onclick="location.href='https://www.sefaria.org/'">Erneut versuchen</button>
  </div>
</body>
</html>
