name: Build
on:
  workflow_dispatch:
  push:
    tags: ['v*', '[0-9]*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows: manche mitgelieferten Texte haben Pfade über 260 Zeichen, ohne diese Einstellung scheitert das Auschecken
      - run: git config --system core.longpaths true
        if: runner.os == 'Windows'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npm test
      - run: npx electron-builder ${{ matrix.os == 'macos-latest' && '--mac' || matrix.os == 'windows-latest' && '--win' || '--linux' }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: sefaria-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: warn
      - name: An das GitHub-Release hängen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          generate_release_notes: true
