name: Build
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build for Linux ARM64
        required: true
        type: string
permissions:
  contents: write
jobs:
  linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Set package homepage metadata
        run: |
          node -e "const fs = require('node:fs'); const file = 'app/package.json'; const p = JSON.parse(fs.readFileSync(file, 'utf8')); p.homepage = 'https://github.com/mitkin89/Safran'; fs.writeFileSync(file, JSON.stringify(p, null, 2) + '\n');"
      - run: npm ci
      - run: npm test
      - run: npm exec --workspace safran -- electron-builder --config build/config.cjs --linux deb --arm64 --publish never
      - name: Verify Debian and executable architectures
        run: |
          package=$(find dist -maxdepth 1 -name '*_arm64.deb' -print)
          test "$(dpkg-deb -f "$package" Architecture)" = arm64
          test "$(dpkg-deb -f "$package" Version)" = "${{ inputs.release_tag }}"
          sha256sum "$package"
          readelf -h dist/linux-arm64-unpacked/safran | grep -E 'Machine:.*AArch64'
      - uses: actions/upload-artifact@v4
        with:
          name: safran-linux-arm64
          path: dist/*_arm64.deb
          if-no-files-found: error
      - name: Attach the package to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = false
          gh release upload "$RELEASE_TAG" dist/*_arm64.deb
